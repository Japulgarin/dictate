[package]
name = "dictate"
version = "0.1.0"
edition = "2021"
description = "Local hotkey speech-to-text bubble (Rust rewrite)"
license = "MIT"

[dependencies]
eframe = "0.29"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
anyhow = "1"
cpal = "0.15"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
